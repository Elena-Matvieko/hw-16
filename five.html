<!-- Задание 5. Работа с querySelectorAll
Задача: создайте несколько элементов <p> с разными классами. Используйте querySelectorAll,
чтобы найти все элементы с классом description и изменить их текст.

Инструкция:
В HTML создайте несколько абзацев <p>, некоторые из них должны иметь класс description.
Используйте querySelectorAll для поиска всех элементов с классом description.
Переберите найденные элементы и измените их текстовое содержимое.
Как должно работать: после выполнения скрипта все элементы с классом description
изменяют свой текст на «Новый текст». -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="description">Текст будет изменнен.</p>
    <p class="description">Текст будет изменнен 1.</p>
    <p class="text">Останиться прежним.</p>
    <p class="change-text">Останиться прежним 2.</p>

    <button id ="change-btn">Изменить текст</button>
    
    <script>
        // Ссылки на элемент
        const changeBtn = document.querySelector('#change-btn');
        const descriptionEl = document.querySelectorAll('.description');

        changebtnEl.addEventListener('click',function(){
            descriptionElements.forEach(function(element) { 
                element.textContent = 'Измененный текст'; 
            });
         });





    </script>
</body>
</html>
