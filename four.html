<!-- Задание 4. Поиск и изменение элементов по классу.
    Задача: найдите все элементы с классом description и измените их текст на «Измененный текст».
Инструкция:
В HTML создайте несколько элементов с классом description.
Используйте метод querySelectorAll для поиска всех элементов с этим классом.
Переберите найденные элементы и измените их текстовое содержимое с помощью свойства 
textContent.
Как должно работать: после выполнения скрипта все элементы с классом description
изменяют свой текст на «Измененный текст». -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="description">Первый элемент.</p>
    <p class="description">Второй элемент.</p>
    <p class="description">Третий элемент.</p>
    <button id="change-text">Поменять цвет текста</button>
  <script>
//   Получаем ссылки на кнопку и на ВСЕ элементы с классом

    const changeTextBtn = document.querySelector('#change-text');
    const descriptionElClass = document.querySelectorAll('.description');
    
//    Назначаем обработчик события клика на кнопку
   changeTextBtn.addEventListener('click', function() {

    // Перебираем каждый найденный элемент
    
descriptionElClass.forEach(element => {
    element.textContent = 'Измененный текст ';
});
});

  </script>
</body>
</html>
